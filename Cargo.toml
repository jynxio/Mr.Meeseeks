[package]
name = "meeseeks"
version = "0.1.0"
edition = "2024"

[features]
dev = []

[dependencies]
directories = "6.0.0"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "form",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
