[package]
name = "meeseeks"
version = "0.1.0"
edition = "2024"

[features]
dev = []

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
directories = "6.0.0"
keyring = "4.1.6"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "form",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
